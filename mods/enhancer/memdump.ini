; ============================================================================
; Ace Combat Zero: The Belkan War — Diagnostic Memory Dumper Configuration (v0.16.3)
; Path: <GameDir>\mods\enhancer\memdump.ini
; Used by: mods\memdump.dll
; ============================================================================

[MemoryDump]
; EnableLogging: Write [MemDump] events directly into modloader.log
EnableLogging=1

; EnableMemoryDump: Master switch for diagnostic memory dumps in mods\memory_dumps\
EnableMemoryDump=1

; EnableF2MemoryDump: Press F2 at any moment in-game to create an instant memory dump
EnableF2MemoryDump=1

; DumpMemoryOnExit: Automatically create a memory & state dump when the game closes
DumpMemoryOnExit=0

; SaveScreenshotOnDump: Capture the rendered D3D12 backbuffer right before Present
SaveScreenshotOnDump=1

; AutoDeleteOldDumps: Automatically delete old dump_* folders in mods\memory_dumps\ on startup
AutoDeleteOldDumps=1

; MaxDumpAgeHours: Maximum age of dump folders in hours before automatic cleanup (default: 24)
MaxDumpAgeHours=24

; WriteMinidumpFile: Write a standard Windows .dmp file (acz_process.dmp) inside each dump folder
WriteMinidumpFile=1

; FullMemoryMinidump: Set to 1 to dump the entire process RAM (large file) or 0 for compact debug .dmp
FullMemoryMinidump=0

; DumpLiveResourcesOnMemoryDump: Export live textures/fonts & 4MB GS VRAM when a dump is triggered
DumpLiveResourcesOnMemoryDump=1
