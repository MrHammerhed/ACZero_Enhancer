; ============================================================================
; Ace Combat Zero: The Belkan War — Diagnostic Memory Dumper Configuration (v0.16)
; Path: <GameDir>\mods\enhancer\memdump.ini
; Used by: mods\memdump.dll (v0.16)
; ============================================================================

[MemoryDump]
; Write [MemDump] initialization and memory dump events to modloader.log
EnableLogging=1

; Master switch for diagnostic memory & state dumps in mods\memory_dumps\
EnableMemoryDump=1

; Press F2 while the game window is focused to trigger an instant memory dump
EnableF2MemoryDump=1

; Create a diagnostic memory dump automatically when the game exits
DumpMemoryOnExit=0

; Capture the rendered D3D12 backbuffer right before Present and save screenshot.png
SaveScreenshotOnDump=1

; Automatically delete old dump_* folders in mods\memory_dumps\ on game startup
AutoDeleteOldDumps=1

; Maximum age of dump folders in hours before automatic cleanup on startup (default: 24)
MaxDumpAgeHours=24

; Write a Windows Minidump file (acz_process.dmp) inside each dump folder
WriteMinidumpFile=1

; Include full process RAM in acz_process.dmp (MiniDumpWithFullMemory - large file)
FullMemoryMinidump=0

; Request acz_hdtex.dll (if loaded) to export live textures, fonts & 4MB VRAM snapshot
DumpLiveResourcesOnMemoryDump=1
