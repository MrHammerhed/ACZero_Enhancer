; ============================================================================
; Ace Combat Zero: The Belkan War — ACZero Enhancer Configuration (v0.25)
; Path: <GameDir>\mods\enhancer\enhancer.ini
; Used by: mods\enhancer\enhancer.asi
; ============================================================================

[Enhancer]
; EnableLogging: Write [Enhancer] events directly into mods\enhancer\enhancer.log (1 = Yes, 0 = No)
EnableLogging=1

; FastStartup: Multi-stage startup acceleration mode (default: 0):
;   0 = Disabled (vanilla startup flow)
;   1 = Skip native launcher & pad manual screen; press any button during intro logos to jump directly to Title Screen
;   2 = Level 1 + remove 2x30-frame Memory Card UI delays & auto-skip intro logos directly to Title Screen
;   3 = Level 2 + auto-skip Title Screen directly to Main Menu
FastStartup=0

; EnableMenuOverrides: Load custom 16:9 / 21:9 widescreen menu layouts from mods\textures\menus\ (1 = Yes, 0 = No)
EnableMenuOverrides=1

; MenuAspectMode: Widescreen menu aspect mode:
;   0 = Auto (follows in-game Display Settings: 4:3, 16:9, or 21:9)
;   1 = Force 16:9
;   2 = Force 4:3
;   3 = Force 21:9
MenuAspectMode=0

; Unlock2PlayerCampaign: Two-player Co-Op / VS Mode input behavior:
;   0 = Single-Player mode (merges Gamepad and Keyboard into Player 1; keeps 2P NEW GAME & VS MODE locked)
;   1 = Two-Player mode (unlocks 2P NEW GAME & VS MODE; Player 1 = Gamepad, Player 2 = Keyboard)
Unlock2PlayerCampaign=0

[DrawDistance]
; DrawDistance: Unified extended draw distance mode (2x artifact-free horizon, 19x19 terrain grid,
;   automatic procedural OOB terrain extension, 524km WRAP cloud shadows, 60 FPS terrain LOD & universal stage support):
;   0 = Disabled (vanilla draw distance, default)
;   1 = Enabled
DrawDistance=0

; RadialFog: Spherical (circular) fog distance replacing vanilla planar Z fog so terrain, buildings, and trees
;   never pop in at screen corners when rotating the camera (active in both vanilla and DrawDistance modes):
;   1 = Enabled (default)
;   0 = Disabled (vanilla planar Z fog)
RadialFog=1

[Widescreen]
; ScreenAspect: Active aspect ratio stored independently of the save file (100% save-safe):
;   0 = 4:3 Standard
;   1 = 16:9 Widescreen (Default)
;   2 = 21:9 Ultrawide
; The save file on disk always retains standard 16:9 to guarantee clean compatibility.
; Can be toggled in-game via OPTIONS -> DISPLAY SETTINGS -> SCREEN SIZE or edited directly here.
ScreenAspect=1
