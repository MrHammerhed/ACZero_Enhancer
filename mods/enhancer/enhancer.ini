; ============================================================================
; Ace Combat Zero: The Belkan War — ACZero Enhancer Configuration (v0.23.5)
; Path: <GameDir>\mods\enhancer\enhancer.ini
; Used by: mods\enhancer.dll
; ============================================================================

[Enhancer]
; EnableLogging: Write [Enhancer] events directly into modloader.log (1 = Yes, 0 = No)
EnableLogging=1

; EnableMenuOverrides: Load custom 16:9 / 21:9 widescreen menu layouts from mods\textures\menus\ (1 = Yes, 0 = No)
EnableMenuOverrides=1

; MenuAspectMode: Widescreen menu aspect mode:
;   0 = Auto (follows in-game Display Settings: 4:3, 16:9, or 21:9)
;   1 = Force 16:9
;   2 = Force 4:3
;   3 = Force 21:9
MenuAspectMode=0

; Unlock2PlayerCampaign: Two-player Co-Op / VS Mode input behavior:
;   0 = Single-Player mode (merges Gamepad and Keyboard into Player 1; keeps 2P NEW GAME & VS MODE locked)
;   1 = Two-Player mode (unlocks 2P NEW GAME & VS MODE; Player 1 = Gamepad, Player 2 = Keyboard)
Unlock2PlayerCampaign=0

[Widescreen]
; ScreenAspect: Active aspect ratio stored independently of the save file (100% save-safe):
;   0 = 4:3 Standard
;   1 = 16:9 Widescreen (Default)
;   2 = 21:9 Ultrawide
; The save file on disk always retains standard 16:9 to guarantee clean compatibility.
; Can be toggled in-game via OPTIONS -> DISPLAY SETTINGS -> SCREEN SIZE or edited directly here.
ScreenAspect=1
