; =============================================================================
; ACZero Enhancer — Official Main Menu & Options Localization (English US)
; Path: mods\enhancer\ui\strings_en.ini
; Hot-Reload: Edit and save this file while the game is running (or press F5)
;             to reload all UI text live without recompiling!
; Format: key = value  (use \n for line breaks)
; =============================================================================

[MainMenu]
breadcrumb.root = MAIN MENU
prompt.ok = OK
prompt.cancel = CANCEL

; Root categories (Depth 0)
root.0.label = CAMPAIGN
root.0.desc  = Play through the game following a storyline.
root.1.label = VS MODE
root.1.desc  = Play against other players in this mode.
root.2.label = OPTIONS
root.2.desc  = Adjust various settings.

; Campaign items (Depth 1)
camp.continue.label = CONTINUE
camp.continue.desc  = Continue with the mission.
camp.new.label      = NEW GAME
camp.new.desc       = Start a new campaign.
camp.sp.label       = SP NEW GAME
camp.sp.desc        = Start a new campaign.\nAll aircraft, money, and unlocked modes\nobtained previously are carried over.
camp.free.label     = FREE MISSION
camp.free.desc      = Play any mission that has been cleared in Campaign Mode.\nChanges in the Ace Style Gauge are not reflected.
camp.ace.label      = ACE STYLE
camp.ace.desc       = View flight, Ace Style Gauge, Medal, and\nrival pilot data.
camp.data.label     = GAME DATA
camp.data.desc      = Save and/or load data.

; Difficulty levels (Depth 2 under NEW GAME / SP NEW GAME / FREE MISSION)
diff.0.label = VERY EASY
diff.0.desc  = Level of difficulty suitable for\nfirst-time players.
diff.1.label = EASY
diff.1.desc  = Level of difficulty suitable for\nnovice players.
diff.2.label = NORMAL
diff.2.desc  = Level of difficulty suitable for\naverage players.
diff.3.label = HARD
diff.3.desc  = Level of difficulty suitable for\nadvanced players.
diff.4.label = EXPERT
diff.4.desc  = Level of difficulty suitable for\nexpert players.
diff.5.label = ACE
diff.5.desc  = Level of difficulty suitable for\nonly the most advanced players.
diff.6.label = FREE FLIGHT
diff.6.desc  = Fly any stage without enemies.

; Control scheme (Depth 3 under NEW GAME / SP NEW GAME)
ctrl.0.label = NORMAL
ctrl.0.desc  = The standard control scheme. Default settings use the left stick\nfor pitch and roll, and LB and RB for yaw. Allows for realistic,\nprecise aircraft control. Beginners should try this first.
ctrl.1.label = NOVICE
ctrl.1.desc  = A simplified control scheme. Simply move the left stick left\nor right to turn. Recommended for those who find Normal\ncontrols too difficult.

; Voiceover language (Depth 4 under NEW GAME / SP NEW GAME)
voice.0.label = JAPANESE
voice.0.desc  = Use Japanese voiceover audio.
voice.1.label = ENGLISH
voice.1.desc  = Use English voiceover audio.

; Subtitle language (Depth 5 under NEW GAME / SP NEW GAME)
sub.0.label = JAPANESE
sub.0.desc  = Display Japanese subtitles.
sub.1.label = ENGLISH(US)
sub.1.desc  = Display English (US) subtitles.
sub.2.label = ENGLISH(UK)
sub.2.desc  = Display English (UK) subtitles.
sub.3.label = GERMAN
sub.3.desc  = Display German subtitles.
sub.4.label = FRENCH
sub.4.desc  = Display French subtitles.
sub.5.label = ITALIAN
sub.5.desc  = Display Italian subtitles.
sub.6.label = SPANISH
sub.6.desc  = Display Spanish subtitles.
sub.7.label = NO SUB
sub.7.desc  = No in-game subtitles.

; Game Data (Depth 2 under GAME DATA)
data.save.label = SAVE
data.save.desc  = Save a game file.
data.load.label = LOAD
data.load.desc  = Load a game file.

; Options root categories (Depth 1 under OPTIONS)
opt.0.label = CONTROLLER SETTINGS
opt.0.desc  = Configure controls.
opt.1.label = LANGUAGE SETTINGS
opt.1.desc  = Adjust language settings.
opt.2.label = DISPLAY SETTINGS
opt.2.desc  = Adjust display settings.
opt.3.label = SOUND SETTINGS
opt.3.desc  = Adjust sound settings.
opt.4.label = SCREEN SETTINGS
opt.4.desc  = Adjust screen settings.
opt.5.label = ENHANCER SETTINGS
opt.5.desc  = Configure ACZero Enhancer, HD Textures, and Diagnostics.

; Display Settings (Depth 2 under OPTIONS > DISPLAY SETTINGS)
disp.0.label = QUICK SELECT
disp.0.desc  = Change plane select settings.
disp.0.opt0.label = ON
disp.0.opt0.desc  = Switch to simplified plane select display.
disp.0.opt1.label = OFF
disp.0.opt1.desc  = Normal setting. View planes during plane select.

disp.1.label = WINGMAN COMMAND
disp.1.desc  = Adjust Wingman Command display.
disp.1.opt0.label = ON
disp.1.opt0.desc  = Tap the D-pad to display commands.\nTap once more to select a command.
disp.1.opt1.label = OFF
disp.1.opt1.desc  = Tap the D-pad to immediately enter a command without first\ndisplaying commands.

disp.2.label = HUD
disp.2.desc  = Change HUD display settings.
disp.2.opt0.label = ON
disp.2.opt0.desc  = Display HUD.
disp.2.opt1.label = OFF
disp.2.opt1.desc  = Hide HUD.

disp.3.label = HUD SCALE
disp.3.desc  = Switch HUD airspeed and altitude display.
disp.3.opt0.label = KNOTS / FEET
disp.3.opt0.desc  = Display airspeed in nautical miles\nper hour and altitude in feet.
disp.3.opt1.label = KPH / METERS
disp.3.opt1.desc  = Display airspeed in kilometers per hour\nand altitude in meters.

; Screen Settings (Depth 2 under OPTIONS > SCREEN SETTINGS)
scr.0.label = SCREEN POSITION
scr.0.desc  = Adjust screen position.
scr.1.label = BRIGHTNESS
scr.1.desc  = Adjust screen brightness.

; Sound Settings descriptions (for Phase 2 Sound submenu)
sound.mode.desc = Use the left stick to switch between Mono, Stereo, and\nSurround settings.
sound.bgm.desc  = Use the left stick to set BGM volume.\n[0]: Mute   [15]: Max volume\nDoes not apply to some scenes.
sound.radio.desc = Use the left stick to set radio transmissions volume.\n[0]: Mute   [15]: Max volume\nDoes not apply to some scenes.
sound.se.desc   = Use the left stick to set game sound effect volume.\n[0]: Mute   [15]: Max volume\nDoes not apply to some scenes.
sound.sys.desc  = Use the left stick to set system sound effect volume.\n[0]: Mute   [15]: Max volume\nDoes not apply to some scenes.

; Enhancer Settings categories (Depth 2 under OPTIONS > ENHANCER SETTINGS)
enh.cat.0.label = GRAPHICS
enh.cat.0.desc  = Configure display mode, resolution, draw distance, and fog.
enh.cat.1.label = GAMEPLAY
enh.cat.1.desc  = Configure fast startup, 2-Player mode, and custom UI.
enh.cat.2.label = HD TEXTURES
enh.cat.2.desc  = Configure acz_hdtex.asi texture engine and button glyphs.
enh.cat.3.label = DIAGNOSTICS
enh.cat.3.desc  = Configure logging and crash memory dump tools.

; Enhancer Settings — GRAPHICS
enh.disp_mode.label  = DISPLAY MODE
enh.disp_mode.desc   = Switches between Windowed and native-resolution Borderless Fullscreen.\n[Applied on exit]
enh.disp_res.label   = RESOLUTION
enh.disp_res.desc    = Selects output resolution for Windowed mode (Borderless uses native monitor resolution).\n[Applied on exit]
enh.wide_ovr.label   = WIDESCREEN OVERRIDE
enh.wide_ovr.desc    = Limits menu width on ultrawide displays (AUTO, FORCE 4:3, or FORCE 16:9).\n[Instant apply]
enh.draw_dist.label  = EXTENDED DRAW DISTANCE
enh.draw_dist.desc   = Expands coarse terrain grid to 19x19 with procedural OOB terrain.\n[Applies on next mission]
enh.radial_fog.label = SPHERICAL RADIAL FOG
enh.radial_fog.desc  = Replaces planar Z-depth fog with 3D spherical distance fog.\n[Restart required]

; Display confirmation dialog (authentic ACZ YES/NO style)
enh.disp_keep.title = Keep display settings? (%d)
enh.disp_dialog.yes = YES
enh.disp_dialog.no  = NO

; Enhancer Settings — GAMEPLAY
enh.fast_start.label = FAST STARTUP
enh.fast_start.desc  = Controls skipping of launcher, logos, and title screen.\n[Restart required]
enh.unlock_2p.label  = 2P CO-OP / VS MODE
enh.unlock_2p.desc   = Unlocks 2-Player modes (P1 Gamepad + P2 Keyboard).\n[Instant apply]
enh.custom_ui.label  = CUSTOM D3D12 UI
enh.custom_ui.desc   = Enables the native-resolution D3D12 HTML/CSS UI engine.\n[Instant apply]

; Enhancer Settings — HD TEXTURES (acz_hdtex.ini)
enh.hd_glyphs.label  = GAMEPAD GLYPHS
enh.hd_glyphs.desc   = Controller prompt icon pack (Auto detects controller live).\n[Instant apply]
enh.hd_cache.label   = DDS CACHE
enh.hd_cache.desc    = Compiles PNG/JPG textures into .dds_cache for fast loading.\n[Restart required]
enh.hd_packs.label   = AUTO-INSTALL PACKS
enh.hd_packs.desc    = Automatically unpacks texture packs from mods\ on startup.\n[Restart required]
enh.hd_fonts.label   = SHARE FONT GLYPHS
enh.hd_fonts.desc    = Shares HD font glyphs across matching dynamic font atlases.\n[Restart required]
enh.hd_hot.label     = HOT-RELOAD TEXTURES
enh.hd_hot.desc      = Re-reads PNG/JPG files from disk when textures are recreated.\n[Instant apply]
enh.hd_dump.label    = DUMP ALL TEXTURES
enh.hd_dump.desc     = Exports loaded textures and fonts to mods\textures_dump\.\n[Instant apply]

; Enhancer Settings — DIAGNOSTICS (memdump.ini + enhancer.ini)
enh.log.label        = ENHANCER LOGGING
enh.log.desc         = Writes runtime diagnostics to mods\enhancer\enhancer.log.\n[Instant apply]
enh.md_enable.label  = MEMORY DUMP ENGINE
enh.md_enable.desc   = Master switch for diagnostic dumps in mods\memory_dumps\.\n[Restart required]
enh.md_f2.label      = F2 QUICK DUMP
enh.md_f2.desc       = Press F2 in-game to capture state summary and screenshot.\n[Restart required]
enh.md_shot.label    = SAVE SCREENSHOT
enh.md_shot.desc     = Captures the D3D12 backbuffer screenshot on each dump.\n[Restart required]
enh.md_exit.label    = DUMP ON EXIT
enh.md_exit.desc     = Writes a diagnostic dump folder when acz.exe exits.\n[Restart required]
enh.md_dmp.label     = MINIDUMP (.DMP)
enh.md_dmp.desc      = Generates a Windows acz_process.dmp minidump inside dumps.\n[Restart required]
enh.md_clean.label   = AUTO-CLEAN (24H)
enh.md_clean.desc    = Automatically deletes dump folders older than 24 hours.\n[Restart required]

