[ACZ_HDTex]
; Ace Combat Zero — HD Texture & Font Replacer Configuration (v0.23.4)
; Note: Memory dumper and QoL settings are located in mods\enhancer\memdump.ini

; EnableLogging: Write [ACZ_HDTex] events directly into modloader.log
EnableLogging=1

; DumpAllGims: Dump loaded textures (into mods\textures_dump\) and font atlases
;              (into mods\textures_dump\fonts\)
DumpAllGims=0

; DumpReplacedTextures: When DumpAllGims=1, set to 0 to skip dumping textures and fonts
;                       that are already replaced in mods\textures\ (set to 1 to dump all)
DumpReplacedTextures=0

; DumpRawGimFiles: When DumpAllGims=1, set to 0 to dump only .png (and .txt for fonts)
;                  without raw .gim / .bin files (set to 1 to also dump .gim / .bin)
DumpRawGimFiles=0

; HotReload: Re-read PNG files from disk when a texture is recreated
HotReload=0

; AutoShareFontGlyphs: Automatically share HD glyph textures from Master Atlases, Family
;                      Atlases, and replaced dynamic fonts matching by ExactHash / TileHash.
AutoShareFontGlyphs=1

; DumpMasterFontAtlas: When DumpAllGims=1, combine ALL seen dynamic font glyphs per size
;                      into single unified MASTER_FONT_32x32.png + .txt and
;                      MASTER_FONT_16x16.png + .txt (plus MASTER_GIM_16x16.png) in
;                      mods\textures_dump\fonts\ for maximally simple editing!
DumpMasterFontAtlas=1

; DumpMergedFamilyAtlases: When DumpAllGims=1, set to 1 if you also want per-typeface
;                          FAMILY_<HASH>_font_<dim>x<dim>.png files (0 = off, keeps folder clean)
DumpMergedFamilyAtlases=0

; DumpIndividualFontAtlases: When DumpAllGims=1, set to 1 if you also want individual
;                            <HASH>_font_<N>gl_<dim>x<dim>.png files (0 = off, keeps folder clean)
DumpIndividualFontAtlases=0

; ShareCharCodeToSingleLineSubtitles: If set to 1, 1-line subtitle blocks (num_strings == 1)
;                                     without their own family replacement can fallback to
;                                     matching by Unicode char_code from any replaced master
;                                     font, while multi-string UI/menu fonts remain isolated.
ShareCharCodeToSingleLineSubtitles=0

; ForceGlobalCharCodeSharing: If set to 1, forces Unicode char_code sharing across all fonts
;                             of the same tile dimension (use 0 to keep distinct typefaces separate)
ForceGlobalCharCodeSharing=0

; DumpSingleLineSubtitles: When DumpIndividualFontAtlases=1, set to 0 to skip redundant
;                          1-line subtitle atlases
DumpSingleLineSubtitles=0

; GamepadGlyphs: Input prompt & manual diagram glyph mode:
;                AUTO = Auto-detect active controller (PlayStation DualSense/DS4, Xbox/XInput, or Keyboard)
;                PS   = Force PlayStation 5 DualSense glyphs & manual diagram
;                XBOX = Force Xbox Series X|S glyphs & stock Xbox manual diagram
;                KB   = Force Keyboard glyphs & stock Keyboard manual diagram
GamepadGlyphs=AUTO
