; Path: <GameDir>\mods\enhancer\acz_hdtex.ini
[Settings]
; Ace Combat Zero HD Texture & Font Replacer v0.21.1 (mods\acz_hdtex.dll)
; Place replacement PNGs into mods\textures\
;   - General GIM / TIM2 texture: <16HEX_HASH>.png (+ optional .json)
;   - Unified Master Font Atlas: MASTER_EN_font_32x32.png (+ .txt and .json)

; Write [ACZ_HDTex] logs directly into modloader.log (1 = Yes, 0 = No)
EnableLogging=1

; Re-read PNGs from disk every time a texture is recreated (1 = Yes, 0 = No)
HotReload=0

; Share HD glyphs from any replaced font / MASTER_FONT atlas across all text blocks
AutoShareFontGlyphs=1

; Fallback char_code glyph sharing ONLY for 1-line subtitle blocks (default: 1)
ShareCharCodeToSingleLineSubtitles=1

; Force global char_code sharing across ALL fonts of the same tile size (default: 0)
ForceGlobalCharCodeSharing=0

; Dump seen GIM/TIM2 textures to mods\textures_dump\ and font atlases to mods\textures_dump\fonts\
DumpAllGims=0

; Also dump textures/fonts that already have a replacement in mods\textures\
DumpReplacedTextures=0

; Combine all seen dynamic font glyphs into MASTER_FONT_32x32.png and MASTER_FONT_16x16.png
DumpMasterFontAtlas=1

; Also dump separate FAMILY_<HASH>_font_<dim>x<dim>.png files per typeface
DumpMergedFamilyAtlases=0

; Also dump individual per-block <HASH>_font_<N>gl_<dim>x<dim>.png files
DumpIndividualFontAtlases=0

; Also dump redundant 1-line subtitle blocks when DumpIndividualFontAtlases=1
DumpSingleLineSubtitles=0

; Also dump raw binary .gim and .bin files alongside decoded .png files
DumpRawGimFiles=0
