name: Crash & Bug Report
description: Report a game crash, exception, or visual/input bug
title: "[CRASH / BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please report issues and crashes below. Make sure to attach **`mods/enhancer/enhancer.log`** and the crash dump folder generated by **`memdump.asi`** (`mods/memory_dumps/dump_*`).
  - type: checkboxes
    id: checklist
    attributes:
      label: Mandatory Attachments
      description: Please confirm that you have attached the required diagnostic files:
      options:
        - label: I have attached `mods/enhancer/enhancer.log`.
          required: true
        - label: In case of a crash, I have attached the crash dump folder (`mods/memory_dumps/dump_*`) containing `memory_report.txt`, `acz_process.dmp` (if enabled), and `screenshot.png` (if generated).
          required: false
  - type: dropdown
    id: game_version
    attributes:
      label: Game Version (`acz.exe`)
      description: Which PC port build of Ace Combat Zero are you running?
      options:
        - "2.0.0.1 (Standalone Steam)"
        - "1.0.2.1 (Initial Release)"
        - "Unknown (check enhancer.log or memory_report.txt)"
    validations:
      required: true
  - type: input
    id: enhancer_version
    attributes:
      label: ACZero Enhancer Version
      placeholder: "e.g. v0.24"
    validations:
      required: true
  - type: input
    id: gpu_info
    attributes:
      label: GPU Model & VRAM
      placeholder: "e.g. RTX 3060 12 GB / GTX 1650 4 GB / Steam Deck"
    validations:
      required: true
  - type: input
    id: other_mods
    attributes:
      label: Installed Texture Packs & Other Mods
      placeholder: "e.g. custom textures.zip, OstrichMods HUD v1.2.1, version_orig.dll + .arc mods"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description of the Crash / Bug
      description: Describe what happened and where (e.g. startup black screen, mission, menu, specific action).
      placeholder: "Describe the issue here..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Attach Logs and Dumps
      description: Drag and drop your `mods/enhancer/enhancer.log` and a `.zip` of the `mods/memory_dumps/dump_*` folder here.
      placeholder: "Drag and drop files here..."
    validations:
      required: true
