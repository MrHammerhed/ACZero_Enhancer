name: Crash & Bug Report
description: Report a game crash or exception
title: "[CRASH / BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please report issues and crashes below. Make sure to attach the diagnostic log and crash dump generated by `memdump.dll`.
  - type: checkboxes
    id: checklist
    attributes:
      label: Mandatory Attachments
      description: In case of a game crash, please confirm that you have attached the required diagnostic files:
      options:
        - label: I have attached `modloader.log` from the root game directory.
          required: true
        - label: In case of a crash, I have attached the crash dump folder (`mods/memory_dumps/dump_*`) containing `memory_report.txt`, `acz_process.dmp`, and `screenshot.png` (if generated).
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description of the Crash / Bug
      description: Describe what happened and where (e.g. mission, menu, action).
      placeholder: "Describe the issue here..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Attach Logs and Dumps
      description: Drag and drop your `modloader.log` and `.zip` of the `dump_*` folder here.
      placeholder: "Drag and drop files here..."
    validations:
      required: true
